server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_comp_level 6;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prerendered pages are served without trailing slashes (canonical URLs).
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 3D models and images change rarely.
    location ~* ^/(models|img|showcase)/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /llms.txt { default_type text/plain; charset utf-8; }
    location = /llms-full.txt { default_type text/plain; charset utf-8; }

    location / {
        # HTML is revalidated so deploys show up immediately.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404/index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
